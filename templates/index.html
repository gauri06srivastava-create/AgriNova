<!DOCTYPE html>
<html>
<head>
    <title>AgriNova | Smart Agriculture</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌱 AgriNova</h1>
        <p>Smart Crop Recommendation System</p>
        <p>Find the right crop for your soil.</p>
    </div>

    <div class="form-card">

        <form method="POST">

            <div class="form-grid">

                <div class="input-group">
                    <label>Nitrogen (N)</label>
                    <input type="number" step="any" name="N" required>
                </div>

                <div class="input-group">
                    <label>Phosphorus (P)</label>
                    <input type="number" step="any" name="P" required>
                </div>

                <div class="input-group">
                    <label>Potassium (K)</label>
                    <input type="number" step="any" name="K" required>
                </div>

                <div class="input-group">
                    <label>Temperature (°C)</label>
                    <input type="number" step="any" name="temperature" required>
                </div>

                <div class="input-group">
                    <label>Humidity (%)</label>
                    <input type="number" step="any" name="humidity" required>
                </div>

                <div class="input-group">
                    <label>Soil pH</label>
                    <input type="number" step="any" name="ph" required>
                </div>

                <div class="input-group">
                    <label>Rainfall (mm)</label>
                    <input type="number" step="any" name="rainfall" required>
                </div>

            </div>

            <button type="submit">
                Recommend Crop 🌾
            </button>

        </form>

        {% if prediction %}
        <div class="result">
            <h2>Recommended Crop 🌱</h2>
            <h3>{{ prediction }}</h3>
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
